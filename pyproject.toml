[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "redhanded"
version = "0.1.0"
description = "Anti-cheat for AI coding agents: catch skipped or weakened tests, hard-coded answers, neutered CI, and 'all tests pass' claims the transcript contradicts."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ChunChun451" }]
keywords = ["ai", "coding-agents", "claude-code", "reward-hacking", "testing", "code-review", "guardrails"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/ChunChun451/redhanded"
Documentation = "https://github.com/ChunChun451/redhanded/blob/main/docs/rules.md"
Issues = "https://github.com/ChunChun451/redhanded/issues"
Changelog = "https://github.com/ChunChun451/redhanded/blob/main/CHANGELOG.md"

[project.scripts]
redhanded = "redhanded.cli:main"

[tool.setuptools]
package-dir = { "" = "skills/redhanded/scripts/lib" }

[tool.setuptools.packages.find]
where = ["skills/redhanded/scripts/lib"]
